<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17305f">
<title>ベンゼン暗記帳 V2</title>
<style>
:root{--blue:#2f5bd3;--navy:#17305f;--bg:#f3f6fb;--line:#d9e1ee;--text:#172033;--muted:#65728a;--green:#15803d;--red:#c62828;--white:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
header{background:var(--navy);color:#fff;padding:22px 18px 20px}
header h1{font-size:24px;margin:0 0 6px}
header p{margin:0;opacity:.9;font-size:13px}
main{max-width:720px;margin:0 auto;padding:14px 14px 40px}
.panel{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 4px 18px rgba(20,40,80,.06)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:#f3f6fc;border-radius:15px;text-align:center;padding:14px 6px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.bar{height:8px;background:#e7ecf4;border-radius:99px;margin-top:12px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--blue);border-radius:99px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
select,input{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--text)}
.mode-grid{display:grid;gap:10px}
.mode{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:17px;padding:16px}
.mode strong{display:block;font-size:18px;margin-bottom:4px}
.mode small{color:var(--muted)}
.mode.primary{border-color:#b8c9f8;background:#f7f9ff}
.study{display:none}
.study.active{display:block}
.home.active{display:block}
.screen.hidden{display:none}
.study-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.back{border:0;background:#eef2f8;border-radius:12px;padding:10px 13px;font-weight:700}
.flash{background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px 20px;text-align:center;min-height:330px;display:flex;flex-direction:column;justify-content:center}
.badge{display:inline-block;background:#edf3ff;color:var(--blue);padding:6px 10px;border-radius:99px;font-size:12px;font-weight:700}
.prompt{font-size:22px;line-height:1.55;font-weight:800;margin:20px 0}
.answer{background:#f7f9fc;border:1px solid var(--line);border-radius:14px;padding:15px;text-align:left;line-height:1.7;white-space:pre-wrap}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.btnrow.three{grid-template-columns:1fr 1fr 1fr}
.btn{border:0;border-radius:13px;padding:13px;font-weight:800}
.blue{background:var(--blue);color:#fff}
.gray{background:#eef2f7}
.green{background:#ecfdf3;color:var(--green);border:1px solid #a7e0bd}
.red{background:#fff1f2;color:var(--red);border:1px solid #f3b5bd}
.hint{color:var(--muted);font-size:13px;text-align:center}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#172033;color:#fff;padding:11px 16px;border-radius:12px;display:none;z-index:20;max-width:90%}
.source img{max-width:100%;border-radius:12px}
.small{font-size:12px;color:var(--muted);line-height:1.6}
</style>
</head>
<body>
<header><h1>ベンゼン暗記帳</h1><p>ベンゼン誘導体・反応試薬・合成経路</p></header>

<main>
<section id="home" class="home active">
  <div class="panel">
    <div class="stats">
      <div class="stat"><b id="total">0</b><span>全カード</span></div>
      <div class="stat"><b id="known">0</b><span>覚えた</span></div>
      <div class="stat"><b id="review">0</b><span>要復習</span></div>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <p class="hint" id="progressText">読み込み中…</p>
  </div>

  <div class="panel">
    <div class="filters">
      <div><label>出題範囲</label><select id="category"></select></div>
      <div><label>出題対象</label><select id="statusFilter">
        <option value="all">すべて</option><option value="unrated">未評価</option>
        <option value="known">覚えた</option><option value="review">要復習</option>
      </select></div>
    </div>
  </div>

  <div class="panel">
    <div class="mode-grid">
      <button class="mode primary" id="auto"><strong>自動出題</strong><small>カードを順不同で学習</small></button>
      <button class="mode" id="skim"><strong>スキミング</strong><small>答えを確認しながら全体を見直す</small></button>
      <button class="mode" id="weak"><strong>苦手問題</strong><small>「要復習」にしたカードだけ</small></button>
    </div>
  </div>

  <div class="panel">
    <label>カードを検索</label>
    <input id="search" placeholder="物質名・試薬・条件を検索">
  </div>

const CARDS = [{"id":"s01","cat":"物質・構造","front":"ベンゼンの分子式・構造を答える。","back":"C₆H₆。ベンゼン環（6員環、3つの二重結合をもつ表記）。","detail":"","kind":"物質・構造"},{"id":"s02","cat":"物質・構造","front":"クロロベンゼンの分子式・構造を答える。","back":"C₆H₅Cl。ベンゼン環のHをClに置換した構造。","detail":"","kind":"物質・構造"},{"id":"s03","cat":"物質・構造","front":"ベンゼンスルホン酸の構造・式を答える。","back":"C₆H₅SO₃H。ベンゼン環にSO₃Hが結合。","detail":"","kind":"物質・構造"},{"id":"s04","cat":"物質・構造","front":"ベンゼンスルホン酸ナトリウムの式を答える。","back":"C₆H₅SO₃Na。スルホン酸のHがNaになった塩。","detail":"","kind":"物質・構造"},{"id":"s05","cat":"物質・構造","front":"ナトリウムフェノキシドの式を答える。","back":"C₆H₅ONa。フェノールのOHのHがNaになった塩。","detail":"","kind":"物質・構造"},{"id":"s06","cat":"物質・構造","front":"フェノールの式・構造を答える。","back":"C₆H₅OH。ベンゼン環にOHが1つ結合。","detail":"","kind":"物質・構造"},{"id":"s07","cat":"物質・構造","front":"サリチル酸ナトリウムの構造を答える。","back":"o-HOC₆H₄COONa。OHとCOONaがオルト位。","detail":"","kind":"物質・構造"},{"id":"s08","cat":"物質・構造","front":"サリチル酸の式・構造を答える。","back":"o-HOC₆H₄COOH。2-ヒドロキシ安息香酸。","detail":"","kind":"物質・構造"},{"id":"s09","cat":"物質・構造","front":"アセチルサリチル酸（アスピリン）の構造を答える。","back":"o-CH₃COO–C₆H₄–COOH。サリチル酸のOHをアセチル化した物質。","detail":"","kind":"物質・構造"},{"id":"s10","cat":"物質・構造","front":"サリチル酸メチルの構造を答える。","back":"o-HOC₆H₄COOCH₃。サリチル酸のCOOHをメチルエステル化。","detail":"","kind":"物質・構造"},{"id":"s11","cat":"物質・構造","front":"クメンの構造・別名を答える。","back":"C₆H₅CH(CH₃)₂。イソプロピルベンゼン。","detail":"","kind":"物質・構造"},{"id":"s12","cat":"物質・構造","front":"クメンヒドロペルオキシドの構造を答える。","back":"C₆H₅C(CH₃)₂OOH。クメンの側鎖にOOHがついた過酸化物。","detail":"","kind":"物質・構造"},{"id":"s13","cat":"物質・構造","front":"ニトロベンゼンの式・構造を答える。","back":"C₆H₅NO₂。ベンゼン環にNO₂が結合。","detail":"","kind":"物質・構造"},{"id":"s14","cat":"物質・構造","front":"アニリンの式・構造を答える。","back":"C₆H₅NH₂。ベンゼン環にNH₂が結合。","detail":"","kind":"物質・構造"},{"id":"s15","cat":"物質・構造","front":"アニリン塩酸塩の式・構造を答える。","back":"C₆H₅NH₃Cl（C₆H₅NH₃⁺Cl⁻）。アニリンにHClが付加した塩。","detail":"","kind":"物質・構造"},{"id":"s16","cat":"物質・構造","front":"塩化ベンゼンジアゾニウムの構造を答える。","back":"C₆H₅N₂Cl（C₆H₅N₂⁺Cl⁻）。ベンゼンジアゾニウム塩化物。","detail":"","kind":"物質・構造"},{"id":"s17","cat":"物質・構造","front":"p-フェニルアゾフェノールの構造・ d":"r16","cat":"反応・試薬・条件","front":"アニリン塩酸塩からアニリンを遊離させるには？","back":"NaOH水溶液。","detail":"","kind":"反応・試薬・条件"},{"id":"r17","cat":"反応・試薬・条件","front":"アニリン塩酸塩から塩化ベンゼンジアゾニウムを作る条件は？","back":"HCl水溶液、NaNO₂、氷冷。","detail":"","kind":"反応・試薬・条件"},{"id":"r18","cat":"反応・試薬・条件","front":"塩化ベンゼンジアゾニウムをp-フェニルアゾフェノールにするには？","back":"C₆H₅ONa、カップリング。","detail":"","kind":"反応・試薬・条件"},{"id":"r19","cat":"反応・試薬・条件","front":"アニリンからアセトアニリドを作るには？","back":"(CH₃CO)₂O。","detail":"","kind":"反応・試薬・条件"},{"id":"b01","cat":"逆方向","front":"Cl₂、Feでベンゼンから何ができる？","back":"クロロベンゼン。","detail":"","kind":"逆方向"},{"id":"b02","cat":"逆方向","front":"NaOH水溶液・高温高圧でクロロベンゼンから何ができる？","back":"ナトリウムフェノキシド。","detail":"","kind":"逆方向"},{"id":"b03","cat":"逆方向","front":"濃H₂SO₄・加熱でベンゼンから何ができる？","back":"ベンゼンスルホン酸。","detail":"","kind":"逆方向"},{"id":"b04","cat":"逆方向","front":"NaOH水溶液でベンゼンスルホン酸を中和すると？","back":"ベンゼンスルホン酸ナトリウム。","detail":"","kind":"逆方向"},{"id":"b05","cat":"逆方向","front":"ベンゼンスルホン酸ナトリウムをNaOH（固）300℃で処理すると？","back":"ナトリウムフェノキシド。","detail":"","kind":"逆方向"},{"id":"b06","cat":"逆方向","front":"ナトリウムフェノキシドにCO₂を高温・高圧で作用させると？","back":"サリチル酸ナトリウム。","detail":"","kind":"逆方向"},{"id":"b07","cat":"逆方向","front":"サリチル酸ナトリウムを希H₂SO₄で処理すると？","back":"サリチル酸。","detail":"","kind":"逆方向"},{"id":"b08","cat":"逆方向","front":"サリチル酸＋濃H₂SO₄＋(CH₃CO)₂O → 何？","back":"アセチルサリチル酸（アスピリン）。","detail":"","kind":"逆方向"},{"id":"b09","cat":"逆方向","front":"サリチル酸＋濃H₂SO₄＋CH₃OH → 何？","back":"サリチル酸メチル。","detail":"","kind":"逆方向"},{"id":"b10","cat":"逆方向","front":"ベンゼン＋CH₂=CH–CH₃＋H₂SO₄＋AlCl₃ → 何？","back":"クメン。","detail":"","kind":"逆方向"},{"id":"b11","cat":"逆方向","front":"クメンをO₂・空気酸化すると？","back":"クメンヒドロペルオキシド。","detail":"","kind":"逆方向"},{"id":"b12","cat":"逆方向","front":"クメンヒドロペルオキシドを希H₂SO₄で処理すると？","back":"フェノール。","detail":"","kind":"逆方向"},{"id":"b13","cat":"逆方向","front":"ベンゼン＋濃HNO₃＋濃H₂SO₄・加熱 → 何？","back":"ニトロベンゼン。","detail":"","kind":"逆方向"},{"id":"b14","cat":"逆方向","front":"ニトロベンゼンをSn・濃HClで還元すると？","back":"アニリン塩酸塩。","detail":"","kind":"逆方向"},{"id":"b15","cat":"逆方向","front":"アニリン塩酸塩＋NaOH水溶液 → 何？","back":"アニリン。","detail":"","kind":"逆方向"},{"id":"b16","cat":"逆方向","front":"アニリン塩酸塩＋HCl水溶液＋NaNO₂・氷冷 → 何？","back":"塩化ベンゼンジアゾニウム。","detail":"","kind":"逆方向"},{"id":"b17","cat":"逆方向","front":"塩化ベンゼンジアゾニウム＋C₆H₅ONa → 何？","back":"p-フェニルアゾフェノール（p-ヒドロキシアゾベンゼン）。","detail":"","kind":"逆方向"},{"id":"b18","cat":"逆方向","front":"アニリン＋(CH₃CO)₂O → 何？","back":"アセトアニリド。","detail":"","kind":"逆方向"},{"id":"p01","cat":"反応経路","front":"ベンゼンからアスピリンまでの経路を答える。","back":"ベンゼン → ベンゼンスルホン酸 → ベンゼンスルホン酸Na → ナトリウムフェノキシド → サリチル酸Na → サリチル酸 → アセチルサリチル酸。","detail":"","kind":"反応経路"},{"id":"p02","cat":"反応経路","front":"ベンゼンからサリチル酸までの経路を答える。","back":"ベンゼン → ベンゼンスルホン酸 → ベンゼンスルホン酸Na → ナトリウムフェノキシド → サリチル酸Na → サリチル酸。","detail":"","kind":"反応経路"},{"id":"p03","cat":"反応経路","front":"ナトリウムフェノキシドからフェノールまでの経路を答える。","back":"ナトリウムフェノキシド →（CO₂ + H₂O）→ フェノール。※元シート記載。","detail":"","kind":"反応経路"},{"id":"p04","cat":"反応経路","front":"ベンゼンからフェノールを作るクメン法の経路を答える。","back":"ベンゼン → クメン → クメンヒドロペルオキシド → フェノール。","detail":"","kind":"反応経路"},{"id":"p05","cat":"反応経路","front":"ベンゼンからアニリンまでの経路を答える。","back":"ベンゼン → ニトロベンゼン → アニリン塩酸塩 → アニリン。","detail":"","kind":"反応経路"},{"id":"p06","cat":"反応経路","front":"アニリンからアセトアニリドまでの経路を答える。","back":"アニリン → アセトアニリド。試薬：(CH₃CO)₂O。","detail":"","kind":"反応経路"},{"id":"p07","cat":"反応経路","front":"アニリン塩酸塩からp-フェニルアゾフェノールまでの経路を答える。","back":"アニリン塩酸塩 → 塩化ベンゼンジアゾニウム → p-フェニルアゾフェノール。","detail":"","kind":"反応経路"},{"id":"p08","cat":"反応経路","front":"サリチル酸から2つの誘導体への分岐を答える。","back":"サリチル酸 → アセチルサリチル酸（濃H₂SO₄、(CH₃CO)₂O）／サリチル酸メチル（濃H₂SO₄、CH₃OH）。","detail":"","kind":"反応経路"},{"id":"d01","cat":"細部・確認","front":"サリチル酸のOHとCOOHの位置関係は？","back":"オルト位（o-位、2位）。","detail":"","kind":"細部・確認"},{"id":"d02","cat":"細部・確認","front":"p-フェニルアゾフェノールの置換位置は？","back":"アゾ基（–N=N–）とOHがパラ位。","detail":"","kind":"細部・確認"},{"id":"d03","cat":"細部・確認","front":"クメンは何のベンゼン誘導体？","back":"イソプロピルベンゼン。C₆H₅CH(CH₃)₂。","detail":"","kind":"細部・確認"},{"id":"d04","cat":"細部・確認","front":"クメンヒドロペルオキシドに含まれる特徴的な基は？","back":"ヒドロペルオキシ基 –OOH。","detail":"","kind":"細部・確認"},{"id":"d05","cat":"細部・確認","front":"アセトアニリドはアニリンのどこが変化した物質？","back":"アミノ基NH₂がアセチル化され、–NHCOCH₃になった。","detail":"","kind":"細部・確認"},{"id":"d06","cat":"細部・確認","front":"アスピリンはサリチル酸のどこが変化した物質？","back":"フェノール性OHがアセチル化され、–OCOCH₃になった。","detail":"","kind":"細部・確認"},{"id":"d07","cat":"細部・確認","front":"サリチル酸メチルはサリチル酸のどこが変化した物質？","back":"カルボキシ基COOHがメチルエステル–COOCH₃になった。","detail":"","kind":"細部・確認"},{"id":"d08","cat":"細部・確認","front":"ジアゾ化のとき、シートではどの温度条件？","back":"氷冷。アニリン塩酸塩にHCl水溶液・NaNO₂を作用させる。","detail":"","kind":"細部・確認"}];
const KEY = "benzene_v2_fixed_state";
let state = {ratings:{},mode:"auto",list:[],index:0,revealed:false};
let toastTimer;

const $ = id => document.getElementById(id);
const cats = ["すべて", ...new Set(CARDS.map(c=>c.cat))];

function load(){
  try{const x=JSON.parse(localStorage.getItem(KEY)||"null");if(x&&x.ratings)state.ratings=x.ratings;}catch(e){state.ratings={};}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify({ratings:state.ratings}));}catch(e){}}
function status(id){return state.ratings[id]||"未評価";}
function toast(msg){const t=$("toast");t.textContent=msg;t.style.display="block";clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display="none",1800);}
function updateStats(){
  const known=CARDS.filter(c=>status(c.id)==="覚えた").length;
  const review=CARDS.filter(c=>status(c.id)==="要復習").length;
  $("total").textContent=CARDS.length;$("known").textContent=known;$("review").textContent=review;
  const pct=CARDS.length?Math.round(known/CARDS.length*100):0;
  $("bar").style.width=pct+"%";$("progressText").textContent=`覚えたカード ${known} / ${CARDS.length}（${pct}%）`;
}
function setup(){
  $("category").innerHTML=cats.map(c=>`<option>${c}</option>`).join("");
  load();updateStats();
}
function showHome(){$("home").style.display="block";$("study").classList.remove("active");window.scrollTo(0,0);updateStats();}
function showStudy(){$("home").style.display="none";$("study").classList.add("active");window.scrollTo(0,0);}
function makeList(){
  const cat=$("category").value, sf=$("statusFilter").value, q=$("search").value.trim().toLowerCase();
  let list=CARDS.filter(c=>{
    if(cat!=="すべて"&&c.cat!==cat)return false;
    const st=status(c.id);
    if(sf==="unrated"&&st!=="未評価")return false;
    if(sf==="known"&&st!=="覚えた")return false;
    if(sf==="review"&&st!=="要復習")return false;
    if(q&&!(c.front+" "+c.back+" "+c.cat).toLowerCase().includes(q))return false;
    return true;
  });
  if(state.mode==="weak")list=list.filter(c=>status(c.id)==="要復習");
  if(state.mode==="auto")list=list.sort(()=>Math.random()-.5);
  return list;
}
function start(mode){
  state.mode=mode;state.list=makeList();state.index=0;state.revealed=false;
  $("modeTitle").textContent=mode==="weak"?"苦手問題":mode==="skim"?"スキミング":"自動出題";
  $("markKnown").style.display=mode==="skim"?"none":"block";
  $("markReview").style.display=mode==="skim"?"none":"block";
  $("studyHint").textContent=mode==="skim"?"答えを確認しながら、前後のカードで見直します。":"答えを見て、自分で「覚えた」か「要復習」を選んでください。";
  if(!state.list.length){showStudy();render();toast(mode==="weak"?"要復習のカードはありません":"条件に一致するカードがありません");return;}
  showStudy();render();
}
function render(){
  const list=state.list;
  $("count").textContent=list.length?`${state.index+1} / ${list.length}`:"0 / 0";
  if(!list.length){$("cat").textContent="対象なし";$("question").textContent="対象カードがありません。";$("answer").hidden=true;return;}
  const c=list[state.index];
  $("cat").textContent=c.cat;$("question").textContent=c.front;$("answer").textContent=c.back;
  $("answer").hidden=!state.revealed;$("reveal").textContent=state.revealed?"答えを隠す":"答えを見る";
}
function move(n){if(!state.list.length)return;state.index=(state.index+n+state.list.length)%state.list.length;state.revealed=false;render();}
function grade(v){if(!state.list.length)return;state.ratings[state.list[state.index].id]=v;save();updateStats();toast(v+"に記録しました");move(1);}
function shuffle(){state.list=state.list.sort(()=>Math.random()-.5);state.index=0;state.revealed=false;render();}

$("auto").onclick=()=>start("auto");
$("skim").onclick=()=>start("skim");
$("weak").onclick=()=>start("weak");
$("back").onclick=showHome;
$("reveal").onclick=()=>{state.revealed=!state.revealed;render();};
$("prev").onclick=()=>move(-1);$("next").onclick=()=>move(1);$("shuffle").onclick=shuffle;
$("markKnown").onclick=()=>grade("覚えた");$("markReview").onclick=()=>grade("要復習");
$("category").onchange=()=>start(state.mode);
$("statusFilter").onchange=()=>start(state.mode);
$("search").oninput=()=>{if($("search").value.trim())start("auto");};
setup();
</script>
</body>
