<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172a50"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<title>ベンゼン暗記帳</title>
<style>
:root{color-scheme:light;--bg:#f3f5fa;--paper:#fff;--ink:#172033;--muted:#68748b;--blue:#3157c8;--line:#dce2ee;--green:#16845b;--red:#b83b48}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.55}
header{background:#172a50;color:white;padding:calc(16px + env(safe-area-inset-top)) 16px 18px;position:sticky;top:0;z-index:2}header h1{font-size:21px;margin:0}header p{margin:3px 0 0;color:#dbe4ff;font-size:12px}
main{max-width:760px;margin:auto;padding:14px 12px calc(28px + env(safe-area-inset-bottom));display:grid;gap:12px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:0 3px 12px #192b4a08}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{text-align:center;background:#f5f7fc;border-radius:12px;padding:8px 4px}.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted)}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}select,input,button{font:inherit;border-radius:11px;padding:11px;border:1px solid var(--line);background:white;color:var(--ink);min-height:44px}select,input{width:100%}button{font-weight:650;cursor:pointer}button.primary{background:var(--blue);color:white;border-color:var(--blue)}button.ghost{background:#f7f8fc}button.good{color:var(--green);border-color:#a6dbc5}button.bad{color:var(--red);border-color:#efb8be}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:22px 16px;gap:17px}.chip{font-size:12px;font-weight:700;color:#2847a4;background:#edf1ff;border-radius:20px;padding:4px 10px}.question{font-size:clamp(23px,6vw,32px);font-weight:750;white-space:pre-wrap;line-height:1.5}.answer{font-size:clamp(18px,4.5vw,23px);font-weight:650;white-space:pre-wrap;line-height:1.6}.explain{font-size:14px;color:var(--muted);white-space:pre-wrap}.muted{font-size:12px;color:var(--muted)}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.row.three{grid-template-columns:1fr 1fr 1fr}.hidden{display:none!important}.progress{height:6px;background:#e6eaf3;border-radius:10px;overflow:hidden;margin-top:10px}.progress div{height:100%;background:var(--blue);width:0}.feedback{font-size:13px;min-height:20px;margin-top:8px}.listitem{border-top:1px solid var(--line);padding:10px 0}.listitem summary{font-weight:650;cursor:pointer}.listitem p{white-space:pre-wrap}.tag{font-size:11px;color:var(--muted);margin-left:5px}.sectiontitle{font-size:16px;margin:0 0 10px}details summary{cursor:pointer}footer{text-align:center;color:var(--muted);font-size:11px;padding:0 12px 24px}
@media(min-width:600px){main{padding-top:20px}.card{min-height:330px}}
</style></head>
<body>
<header><h1>ベンゼン暗記帳</h1><p>ベンゼン誘導体・反応試薬・合成経路</p></header>
<main>
<section class="panel"><div class="stats"><div class="stat"><b id="total">0</b><span>全カード</span></div><div class="stat"><b id="mastered">0</b><span>覚えた</span></div><div class="stat"><b id="reviewCount">0</b><span>要復習</span></div></div><div class="progress"><div id="progress"></div></div></section>
<section class="panel"><div class="controls"><div><label for="category">出題範囲</label><select id="category"><option value="すべて">すべて</option><option>物質</option><option>反応</option><option>経路</option><option>細部</option></select></div><div><label for="scope">出題対象</label><select id="scope"><option value="all">すべて</option><option value="unseen">未習得を優先</option><option value="weak">要復習だけ</option><option value="known">覚えたカード</option></select></div></div></section>
<section class="panel"><div class="card"><span class="chip" id="kind">カード</span><div class="question" id="question">カードを読み込んでいます…</div><div class="muted" id="hint">答えを考えてから表示</div><div id="answerArea" class="hidden"><div class="answer" id="answer"></div><p class="explain" id="explain"></p></div></div><button class="primary" style="width:100%" id="reveal">答えを見る</button><div class="row three"><button id="prev">← 前へ</button><button id="shuffle" class="ghost">シャッフル</button><button id="next">次へ →</button></div><div class="row"><button class="bad" id="markWeak">要復習</button><button class="good" id="markKnown">覚えた</button></div><div class="feedback" id="feedback"></div></section>
<section class="panel"><h2 class="sectiontitle">入力テスト</h2><label for="typed">答えを入力して確認</label><input id="typed" placeholder="例：濃H₂SO₄、加熱"><div class="row"><button class="primary" id="check">答え合わせ</button><button id="clear" class="ghost">入力を消す</button></div><div class="feedback" id="testFeedback"></div></section>
<section class="panel"><h2 class="sectiontitle">カードを検索</h2><input id="search" placeholder="物質名・試薬・条件を検索"><div id="results"></div></section>
<section class="panel"><h2 class="sectiontitle">学習記録</h2><p class="muted">この端末のブラウザ内に保存します。ホーム画面に追加して同じブラウザで使うと記録を維持できます。</p><button id="reset" class="ghost">学習記録をリセット</button><button id="install" class="primary hidden" style="width:100%;margin-top:8px">アプリをインストール</button></section>
</main><footer>元の反応系統図をもとに作成。反応条件は授業プリントの表記も確認してください。</footer>
<script src="app.js"></script>
</body></html>
